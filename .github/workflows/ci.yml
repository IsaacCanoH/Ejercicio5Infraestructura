name: CI Infraestructura

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    name: Validar Docker Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    env:
      DB_USERNAME: gestor_ci
      DB_PASSWORD: clave_ci_temporal
      MONITORING_USERNAME: monitor_ci
      MONITORING_PASSWORD: monitoreo_ci_temporal
      GRAFANA_ADMIN_PASSWORD: grafana_ci_temporal

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Mostrar version de Docker Compose
        run: docker compose version

      - name: Validar configuracion de Compose
        run: docker compose -f docker-compose.yml config --quiet
      
      - name: Validar escenarios de rendimiento
        run: |
          for perfil in base carga; do
            docker run --rm \
              -v "$GITHUB_WORKSPACE/rendimiento:/pruebas:ro" \
              grafana/k6:2.4.0 inspect --execution-requirements \
              -e "PERFIL=$perfil" /pruebas/prueba-carga.js
          done
    
  validar_terraform:
    name: Validar Terraform AWS
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    defaults:
      run:
        working-directory: aws

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Preparar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - name: Comprobar formato
        run: terraform fmt -check -recursive

      - name: Inicializar proveedor
        run: terraform init -backend=false -input=false

      - name: Validar configuracion
        run: terraform validate

      - name: Validar script de preparacion
        run: bash -n user-data.sh