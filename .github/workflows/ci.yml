name: CI Infraestructura

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    name: Validar Docker Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    env:
      DB_USERNAME: gestor_ci
      DB_PASSWORD: clave_ci_temporal
      DB_ROOT_PASSWORD: root_ci_temporal

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Mostrar version de Docker Compose
        run: docker compose version

      - name: Validar configuracion de Compose
        run: docker compose -f docker-compose.yml config --quiet