groups:
  - name: gestor_servicios
    interval: 30s
    rules:
      - alert: MetricasAPINoDisponibles
        expr: up{job="gestor_api_render"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "No se pueden consultar las métricas de la API"
          description: "La consulta de métricas de la API ha fallado durante dos minutos."

      - alert: MetricasClienteNoDisponibles
        expr: up{job="gestor_cliente_render"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "No se pueden consultar las métricas del cliente"
          description: "La consulta de métricas del cliente ha fallado durante dos minutos."