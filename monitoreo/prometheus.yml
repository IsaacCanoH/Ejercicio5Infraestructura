global:
  scrape_interval: 30s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: gestor_api_render
    scheme: https
    metrics_path: /actuator/prometheus
    scrape_timeout: 10s

    basic_auth:
      username: monitor
      password_file: /run/secrets/monitoring_password

    static_configs:
      - targets:
          - ejercicio5myapigestor-1rp1.onrender.com