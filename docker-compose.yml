name: circuito-devops

services:
  postgres:
    image: postgres:18
    container_name: dbgestor_devops_postgres
    restart: unless-stopped

    ports:
      - "127.0.0.1:5433:5432"

    environment:
      POSTGRES_DB: dbgestor
      POSTGRES_USER: "${DB_USERNAME:?Falta definir DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Falta definir DB_PASSWORD}"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../Ejercicio5MyAPIGestor
      dockerfile: Dockerfile
    image: gestor-api:dev
    container_name: dbgestor_devops_api
    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:8081"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dbgestor
      DB_USERNAME: "${DB_USERNAME:?Falta definir DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD:?Falta definir DB_PASSWORD}"
      MONITORING_USERNAME: "${MONITORING_USERNAME:?Falta definir MONITORING_USERNAME}"
      MONITORING_PASSWORD: "${MONITORING_PASSWORD:?Falta definir MONITORING_PASSWORD}"

    depends_on:
      postgres:
        condition: service_healthy

  cliente:
    build:
      context: ../Ejercicio5Cliente
      dockerfile: Dockerfile
    image: gestor-cliente:dev
    container_name: dbgestor_devops_cliente
    restart: unless-stopped

    ports:
      - "127.0.0.1:8082:8082"

    environment:
      SERVER_PORT: "8082"
      API_BASE_URL: http://api:8081
      MONITORING_USERNAME: "${MONITORING_USERNAME:?Falta definir MONITORING_USERNAME}"
      MONITORING_PASSWORD: "${MONITORING_PASSWORD:?Falta definir MONITORING_PASSWORD}"

    depends_on:
      api:
        condition: service_started
  
  prometheus:
    image: prom/prometheus:v3.13.5
    container_name: dbgestor_devops_prometheus
    restart: unless-stopped

    ports:
      - "127.0.0.1:9090:9090"

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"

    volumes:
      - ./monitoreo/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoreo/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus_data:/prometheus

    secrets:
      - monitoring_password
  
  grafana:
    image: grafana/grafana:13.3.1
    container_name: dbgestor_devops_grafana
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Falta definir GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoreo/grafana-datasource.yml:/etc/grafana/provisioning/datasources/gestor.yml:ro
      - ./monitoreo/grafana-dashboard.yml:/etc/grafana/provisioning/dashboards/gestor.yml:ro
      - ./monitoreo/tablero-api.json:/etc/grafana/dashboards/tablero-api.json:ro

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

secrets:
  monitoring_password:
    environment: MONITORING_PASSWORD