name: circuito-devops

services:
  postgres:
    image: postgres:18
    container_name: dbgestor_devops_postgres
    restart: unless-stopped

    ports:
      - "127.0.0.1:5433:5432"

    environment:
      POSTGRES_DB: dbgestor
      POSTGRES_USER: "${DB_USERNAME:?Falta definir DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Falta definir DB_PASSWORD}"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../Ejercicio5MyAPIGestor
      dockerfile: Dockerfile
    image: gestor-api:dev
    container_name: dbgestor_devops_api
    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:8081"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dbgestor
      DB_USERNAME: "${DB_USERNAME:?Falta definir DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD:?Falta definir DB_PASSWORD}"

    depends_on:
      postgres:
        condition: service_healthy

  cliente:
    build:
      context: ../Ejercicio5Cliente
      dockerfile: Dockerfile
    image: gestor-cliente:dev
    container_name: dbgestor_devops_cliente
    restart: unless-stopped

    ports:
      - "127.0.0.1:8082:8082"

    environment:
      SERVER_PORT: "8082"
      API_BASE_URL: http://api:8081

    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data: